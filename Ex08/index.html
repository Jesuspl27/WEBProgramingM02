<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX08 - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Mi Dashboard</h1>
            <p>Panel de control</p>
        </header>

        <aside>
            <h2>Menú</h2>
            <a href="#">Inicio</a>
            <a href="#">Usuarios</a>
            <a href="#">Estadísticas</a>
            <a href="#">Configuración</a>
        </aside>

        <main>
            <h2>Resumen</h2>

            <div class="cards">
                <div class="card">
                    <h3>Usuarios</h3>
                    <p>1.250</p>
                </div>

                <div class="card">
                    <h3>Ventas</h3>
                    <p>850 €</p>
                </div>

                <div class="card">
                    <h3>Pedidos</h3>
                    <p>126</p>
                </div>

                <div class="card">
                    <h3>Visitas</h3>
                    <p>4.520</p>
                </div>
            </div>

            <h2>Últimos usuarios</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Laura</td>
                        <td>laura@email.com</td>
                        <td>Activo</td>
                    </tr>
                    <tr>
                        <td>Carlos</td>
                        <td>carlos@email.com</td>
                        <td>Activo</td>
                    </tr>
                    <tr>
                        <td>María</td>
                        <td>maria@email.com</td>
                        <td>Inactivo</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <footer>
            <p>Dashboard - 2026</p>
        </footer>

    </div>

</body>
</html>
